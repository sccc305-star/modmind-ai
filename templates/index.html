<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModMind AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ ModMind AI</h1>
            <p class="subtitle">AI-Powered Reddit Moderation Assistant</p>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('post-checker')">📝 Post Checker</button>
            <button class="tab" onclick="showTab('comment-scanner')">💬 Comment Scanner</button>
            <button class="tab" onclick="showTab('action-suggester')">⚡ Action Suggester</button>
            <button class="tab" onclick="showTab('bulk-scanner')">📋 Bulk Scanner</button>
            <button class="tab" onclick="showTab('mod-report')">📊 Mod Report</button>
        </div>

        <!-- Post Checker -->
        <div id="post-checker" class="tab-content active">
            <h2>📝 Check Post Against Rules</h2>
            <textarea id="communityRules" placeholder="Enter your community rules here...
Example:
1. No spam
2. Be respectful
3. No self promotion
4. Stay on topic"></textarea>
            <textarea id="postContent" placeholder="Paste the Reddit post content here..."></textarea>
            <button class="action-btn" onclick="checkPost()">🔍 Check Post</button>
        </div>

        <!-- Comment Scanner -->
        <div id="comment-scanner" class="tab-content">
            <h2>💬 Scan Comment for Toxicity</h2>
            <textarea id="commentContent" placeholder="Paste the Reddit comment here..."></textarea>
            <button class="action-btn" onclick="scanComment()">🔍 Scan Comment</button>
        </div>

        <!-- Action Suggester -->
        <div id="action-suggester" class="tab-content">
            <h2>⚡ Get Moderation Action</h2>
            <textarea id="situationContent" placeholder="Describe the moderation situation...
Example: A user keeps posting off-topic content even after warning. They have 3 violations in the past week."></textarea>
            <button class="action-btn" onclick="suggestAction()">💡 Get Suggestion</button>
        </div>

        <!-- Bulk Scanner -->
        <div id="bulk-scanner" class="tab-content">
            <h2>📋 Bulk Comment Scanner</h2>
            <p style="color:#888;margin-bottom:10px;">Enter each comment on a new line</p>
            <textarea id="bulkComments" placeholder="Comment 1&#10;Comment 2&#10;Comment 3&#10;..." style="min-height:150px;"></textarea>
            <button class="action-btn" onclick="bulkScan()">🔍 Scan All Comments</button>
        </div>

        <!-- Mod Report -->
        <div id="mod-report" class="tab-content">
            <h2>📊 Weekly Mod Report</h2>
            <input type="text" id="communityName" placeholder="Community name e.g. r/technology" style="width:100%;padding:15px;border:2px solid #ffccbc;border-radius:12px;margin-bottom:15px;font-size:1rem;outline:none;">
            <textarea id="modActions" placeholder="Describe recent mod actions...
Example:
- Removed 5 spam posts
- Warned 3 users
- Banned 1 user for hate speech"></textarea>
            <button class="action-btn" onclick="generateReport()">📊 Generate Report</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading" style="display:none;">
            🤔 AI is analyzing...
        </div>

        <!-- Result -->
        <div id="resultContainer" style="display:none;">
            <div class="result-header">
                <span>📊 Analysis Result</span>
                <button class="copy-btn" onclick="copyResult()">📋 Copy</button>
            </div>
            <div id="result" class="result-box"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
